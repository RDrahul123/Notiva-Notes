<!DOCTYPE html>

<head>

<title>Notiva</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236b4fd8'/%3E%3Ctext x='50%25' y='54%25' dominant-baseline='central' text-anchor='middle' font-size='18' fill='white'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
<style>
  body { margin:0; background:#0d0d12; display:flex; align-items:center; justify-content:center; height:100vh; }
  .splash { display:flex; flex-direction:column; align-items:center; gap:16px; }
  .splash-gem { width:64px; height:64px; border-radius:18px; background:linear-gradient(135deg,#7c6cf8,#5a4fd0); display:flex; align-items:center; justify-content:center; font-size:30px; box-shadow:0 12px 40px rgba(124,108,248,0.4); }
  .splash-title { font-family:system-ui,sans-serif; font-size:28px; font-weight:800; color:#f0effe; letter-spacing:-1px; }
  .splash-title span { color:#7c6cf8; }
</style>
</head>
<body>
<div class="splash">
  <div class="splash-gem">✦</div>
  <div class="splash-title">Noti<span>va</span></div>
</div>
<script>
(function() {
  // Detect: true mobile = narrow screen OR touch-only handheld
  var w = window.innerWidth;
  var hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  var isMobile = w < 768 || (hasTouch && w < 1024);

  // Preserve any hash/search
  var qs = location.search || '';
  var hash = location.hash || '';

  if (isMobile) {
    location.replace('mobile.html' + qs + hash);
  } else {
    location.replace('desktop.html' + qs + hash);
  }
})();
</script>
</body>
</html>
